<!DOCTYPE html>
<html>
<head>
    <title>Dry Eye Detection</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="container">

    <div class="profile-card">

        <div class="avatar">
            U
        </div>

        <div class="user-info">
            <h2 id="fullName">Welcome back User</h2>
        </div>

    </div>

    <h1>Dry Eye Detection</h1>

<div class="upload-section">

    <!-- Hidden normal upload -->
    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >

    <!-- Hidden camera input -->
    <input
        type="file"
        id="cameraInput"
        accept="image/*"
        capture="environment"
        hidden
    >

    <!-- Buttons -->
    <div class="image-buttons">
        <button type="button" id="uploadBtn">
            Choose Image
        </button>

        <button type="button" id="cameraBtn">
            Take Photo
        </button>
    </div>

    <!-- Preview -->
    <img
        id="preview"
        src=""
        alt="Preview"
        style="display: none;"
    >

    <button id="predictBtn">
        Analyze Eye Image
    </button>

</div>

    <div id="result">
        Upload an image and click Analyze
    </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/dashboard.js"></script>

</body>
</html>
